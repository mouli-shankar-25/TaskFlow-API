services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_secret
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://taskflow:taskflow_secret@db:5432/taskflow
      - DATABASE_URL_SYNC=postgresql://taskflow:taskflow_secret@db:5432/taskflow
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000"]
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
